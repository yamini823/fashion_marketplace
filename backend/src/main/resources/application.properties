# Server Configuration
server.port=8080

# PostgreSQL Database Configuration
# These use environment variables to keep credentials secure.
# If the environment variables are not set, it defaults to yamora / yamora
spring.datasource.url=jdbc:postgresql://localhost:5432/yamora_marketplace
spring.datasource.username=${DB_USERNAME:yamora}
spring.datasource.password=${DB_PASSWORD:yamora}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
# update: automatically creates or updates tables based on your entity classes.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
